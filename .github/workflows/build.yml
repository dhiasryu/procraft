name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version "^4" --locked
      - name: Pasang NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pprocraft.abis=arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: android/**/build/outputs/apk/**/*.apk
